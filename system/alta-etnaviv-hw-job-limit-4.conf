# /etc/modprobe.d/alta-etnaviv-debug.conf  (root-steps/240, 2026-11-21; replaces the 080 version)
# Let the kernel hand the NPU up to 4 jobs at a time (the etnaviv default) instead of 1. Step 080 set 1 on
# 2026-11-07 to test whether overlapping jobs caused the hard freezes; they did not (the freezes went on with 1 and
# ended with the reset / keep-powered build, root step 110). To go back: root-steps/240's revert line, then reboot.
options etnaviv hw_job_limit=4
