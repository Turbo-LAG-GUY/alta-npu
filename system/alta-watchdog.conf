# /etc/systemd/system.conf.d/alta-watchdog.conf  (root-steps/090)
# systemd (PID 1) pets the SoC's hardware watchdog every 30 s. If the whole board freezes, nothing
# pets it, and the watchdog resets the board after 60 s. To turn it off, delete this file and reboot.
[Manager]
RuntimeWatchdogSec=60s
